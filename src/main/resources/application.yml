spring:
    application:
        name: realtime-chatapp-auth-service
    config:
        import: "configserver:"

    cloud:
        config:
            discovery:
                enabled: true
                service-id: realtime-chatapp-config-service
            fail-fast: true

eureka:
    client:
        service-url:
            defaultZone: ${EUREKA_SERVER_URI:}
    instance:
        instance-id: ${spring.application.name}:${random.value}
